name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/phpunit

  js:
    runs-on: ubuntu-latest
    steps:
      # build.mjs resolves the JS SDK sources at ../../sdks/javascript (contrib hub layout).
      - uses: actions/checkout@v4
        with:
          path: contrib/plugins/woocommerce
      - uses: actions/checkout@v4
        with:
          repository: MainMoney-Inc/mm_aggr_js_sdk
          path: contrib/sdks/javascript
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: contrib/sdks/javascript
      - run: npm install
        working-directory: contrib/plugins/woocommerce
      - run: npm run build
        working-directory: contrib/plugins/woocommerce
